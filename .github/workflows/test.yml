name: test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - run: go vet ./...
      - name: Cross-build every release target
        if: runner.os == 'Linux'
        run: for t in windows/amd64 windows/arm64 darwin/arm64 linux/amd64; do GOOS=${t%/*} GOARCH=${t#*/} go vet ./... && GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .; done
      - run: go test ./...
      - run: go test -race ./...
        if: runner.os != 'Windows' # -race needs cgo; the Windows job runs the plain suite above
      - name: Test source lifecycle (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          ./build.sh
          ./build/mw help add >/dev/null
          ./build.sh clean
          mkdir "$RUNNER_TEMP/miniwaves-remove"
          touch "$RUNNER_TEMP/miniwaves-remove/mw"
          MINIWAVES_INSTALL_DIR="$RUNNER_TEMP/miniwaves-remove" ./uninstall.sh
          test ! -e "$RUNNER_TEMP/miniwaves-remove/mw"
      - name: Test source lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1
          ./build/mw.exe help add | Out-Null
          ./build.ps1 clean
          $env:MINIWAVES_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "miniwaves-remove"
          New-Item -ItemType Directory -Force $env:MINIWAVES_INSTALL_DIR | Out-Null
          New-Item -ItemType File -Path (Join-Path $env:MINIWAVES_INSTALL_DIR "mw.exe") | Out-Null
          ./uninstall.ps1
          if (Test-Path (Join-Path $env:MINIWAVES_INSTALL_DIR "mw.exe")) { throw "uninstall failed" }
      - name: Installer smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          want="$(sed -n 's/^var version = "\(.*\)"/\1/p' gates.go)"
          go build -o "$RUNNER_TEMP/mwbin/mw" .
          for plug in 1 0; do
            h="$RUNNER_TEMP/home$plug"; d="$RUNNER_TEMP/inst$plug"
            mkdir -p "$h"
            if [ "$plug" = 1 ]; then export MW_NO_PLUGINS=1; else unset MW_NO_PLUGINS; fi
            command -v claude >/dev/null && { echo "claude on PATH, test invalid"; exit 1; }
            HOME="$h" MW_USER_CONFIG="$h/user.json" MW_NO_FANFARE=1 MINIWAVES_INSTALL_DIR="$d" MW_INSTALL_FILE="$RUNNER_TEMP/mwbin/mw" sh install.sh
            out="$("$d/mw" version)"
            echo "$out"
            case "$out" in "mw $want "*) ;; *) echo "unexpected version: $out (want $want)"; exit 1 ;; esac
          done
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content install.ps1 -Raw))
          $null = [ScriptBlock]::Create((Get-Content uninstall.ps1 -Raw))
          $want = (Select-String -Path gates.go -Pattern '^var version = "(.*)"').Matches[0].Groups[1].Value
          go build -o (Join-Path $env:RUNNER_TEMP "mwbin\mw.exe") .
          foreach ($plug in 1, 0) {
            $h = Join-Path $env:RUNNER_TEMP "home$plug"
            New-Item -ItemType Directory -Force $h | Out-Null
            $env:USERPROFILE = $h
            $env:MW_USER_CONFIG = Join-Path $h "user.json"
            $env:MW_NO_FANFARE = "1"
            $env:MINIWAVES_NO_PATH = "1"
            $env:MINIWAVES_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "inst$plug"
            $env:MW_INSTALL_FILE = Join-Path $env:RUNNER_TEMP "mwbin\mw.exe"
            if ($plug -eq 1) { $env:MW_NO_PLUGINS = "1" } else { Remove-Item Env:MW_NO_PLUGINS -ErrorAction SilentlyContinue }
            if (Get-Command claude -ErrorAction SilentlyContinue) { throw "claude on PATH, test invalid" }
            ./install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 failed" }
            $out = (& (Join-Path $env:MINIWAVES_INSTALL_DIR "mw.exe") version | Out-String).Trim()
            Write-Output $out
            if (-not $out.StartsWith("mw $want ")) { throw "unexpected version: $out (want $want)" }
          }
      - name: Test published installer (macOS/Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/stormovermars/miniwaves/main/install.sh | MINIWAVES_INSTALL_DIR="$RUNNER_TEMP/miniwaves-bin" sh
          "$RUNNER_TEMP/miniwaves-bin/mw" description >/dev/null
      - name: Test published installer (Windows)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MINIWAVES_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "miniwaves-bin"
          $env:MINIWAVES_NO_PATH = "1"
          Invoke-RestMethod https://raw.githubusercontent.com/stormovermars/miniwaves/main/install.ps1 | Invoke-Expression
          & (Join-Path $env:MINIWAVES_INSTALL_DIR "mw.exe") description | Out-Null
